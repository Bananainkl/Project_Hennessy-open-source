name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Validate version and release notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          build="$(tr -d '[:space:]' < BUILD_NUMBER)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -s RELEASE_NOTES.md
          grep -Fq "${version}" RELEASE_NOTES.md
          grep -Fq "## ${version} (${build})" CHANGELOG.md

      - name: Validate macOS runner
        run: |
          test "$(uname -m)" = "arm64"
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          swift --version
          xcodebuild -version

      - name: Test macOS
        run: |
          set +e
          swift test 2>&1 | tee swift-test.log
          test_status="${PIPESTATUS[0]}"
          set -e
          if [[ "${test_status}" -ne 0 ]]; then
            details="$(tail -n 30 swift-test.log | tr '\n' ' ')"
            echo "::error title=Swift tests failed::${details}"
            exit "${test_status}"
          fi

      - name: Package macOS
        run: |
          BUNDLE_EXTERNAL_TOOLS=0 ./script/package_dmg.sh

      - name: Verify macOS package
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          dmg="dist/Hennessy-${version}-mac.dmg"
          hdiutil verify "${dmg}"
          codesign --verify --deep --strict --verbose=2 dist/Hennessy.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Hennessy.app/Contents/Info.plist)" = "${version}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/Hennessy.app/Contents/Info.plist)" = "$(tr -d '[:space:]' < BUILD_NUMBER)"

      - name: Generate package checksums
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          cd dist
          shasum -a 256 "Hennessy-${version}-mac.dmg" > SHA256SUMS.txt

      - name: Create GitHub Release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Hennessy ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            "dist/Hennessy-${version}-mac.dmg#macOS DMG (ad-hoc signed)" \
            "dist/SHA256SUMS.txt#SHA-256 checksums"

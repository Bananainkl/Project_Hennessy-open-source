name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Validate version and release notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          build="$(tr -d '[:space:]' < BUILD_NUMBER)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -s RELEASE_NOTES.md
          grep -Fq "${version}" RELEASE_NOTES.md
          grep -Fq "## ${version} (${build})" CHANGELOG.md

      - name: Validate macOS runner
        run: |
          test "$(uname -m)" = "arm64"
          swift --version
          xcodebuild -version

      - name: Test macOS
        run: |
          swift test

      - name: Package macOS
        run: |
          ./script/package_dmg.sh

      - name: Verify macOS package
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          dmg="dist/Hennessy-${version}-mac.dmg"
          hdiutil verify "${dmg}"
          codesign --verify --deep --strict --verbose=2 dist/Hennessy.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Hennessy.app/Contents/Info.plist)" = "${version}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/Hennessy.app/Contents/Info.plist)" = "$(tr -d '[:space:]' < BUILD_NUMBER)"

      - name: Test and package Android
        run: |
          export JAVA_HOME="${JAVA_HOME_17_arm64}"
          export PATH="${JAVA_HOME}/bin:${PATH}"
          java -version
          test -x "${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          chmod +x android-app/gradlew
          cd android-app
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          version="$(tr -d '[:space:]' < ../VERSION)"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "${apk}"
          cp "${apk}" "../dist/Hennessy-${version}-android-arm64-debug.apk"

      - name: Generate package checksums
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          cd dist
          shasum -a 256 \
            "Hennessy-${version}-mac.dmg" \
            "Hennessy-${version}-android-arm64-debug.apk" \
            > SHA256SUMS.txt

      - name: Create GitHub Release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Hennessy ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            "dist/Hennessy-${version}-mac.dmg#macOS DMG (ad-hoc signed)" \
            "dist/Hennessy-${version}-android-arm64-debug.apk#Android arm64 APK (debug signed)" \
            "dist/SHA256SUMS.txt#SHA-256 checksums"
